name: ETF site daily update and deploy

on:
  schedule:
    # GitHub Actions Cron uses UTC. China Standard Time is UTC+8.
    - cron: "0 15 * * *" # 23:00 Asia/Shanghai; pipeline skips days without a new trading date
  workflow_dispatch:
    inputs:
      session:
        description: "Update session"
        required: true
        default: "manual"
        type: choice
        options:
          - daily
          - manual
          - noon
          - close
          - retry
          - publish

permissions:
  contents: write

concurrency:
  group: lin-etf-site-daily-update
  cancel-in-progress: false

defaults:
  run:
    working-directory: etf-analysis

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ETF_REQUEST_DELAY: "5"
      ETF_BATCH_SIZE: "15"
      ETF_BATCH_PAUSE: "20"
      ETF_HTTP_CONNECT_TIMEOUT: "5"
      ETF_HTTP_MAX_TIME: "20"
      ETF_AKSHARE_MAX_TIME: "30"
      ETF_CIRCUIT_BREAKER: "true"
      ETF_UPDATE_ATTEMPT: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Verify deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: .
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions Secrets before running the cloud updater."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etf-analysis/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve update session
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            session="${{ inputs.session }}"
          elif [[ "${{ github.event.schedule }}" == "0 15 * * *" ]]; then
            session="daily"
          else
            session="manual"
          fi
          echo "ETF_SESSION=$session" >> "$GITHUB_ENV"
          echo "Selected session: $session"

      - name: Run local tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Update ETF and PETTM caches
        id: cache_update
        timeout-minutes: 45
        continue-on-error: true
        if: env.ETF_SESSION != 'publish'
        env:
          ETF_CHECKPOINT_BATCHES: "true"
        run: python -u collector/daily_pipeline.py --session "$ETF_SESSION"

      - name: Mark interrupted update as partial before publishing
        if: steps.cache_update.outcome == 'failure'
        run: python collector/finalize_interrupted_update.py

      - name: Decide whether a daily publish is needed
        if: env.ETF_SESSION == 'daily'
        shell: bash
        run: |
          if python -c 'import json; raise SystemExit(0 if json.load(open("collector/output/run_context.json")).get("noNewTradingDay") else 1)'; then
            echo "ETF_SKIP_PUBLISH=true" >> "$GITHUB_ENV"
            echo "No new complete trading day; keeping the current Cloudflare deployment."
          else
            echo "ETF_SKIP_PUBLISH=false" >> "$GITHUB_ENV"
          fi

      - name: Publish dashboard files
        if: env.ETF_SKIP_PUBLISH != 'true'
        run: python -u collector/publish_to_dashboard.py

      - name: Run browser-data regression test
        if: env.ETF_SKIP_PUBLISH != 'true'
        run: node tests/dashboard_data_check.js

      - name: Persist validated caches
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A collector/etf_mapping.json collector/candidate_catalog.json collector/output
          if git diff --cached --quiet; then
            echo "No cache changes to commit."
          else
            git commit -m "data: update ETF caches ($ETF_SESSION)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Save raw API responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etf-raw-${{ github.run_id }}-${{ env.ETF_SESSION }}
          path: etf-analysis/collector/output/raw
          if-no-files-found: ignore
          retention-days: 14

      - name: Deploy Cloudflare Worker
        if: env.ETF_SKIP_PUBLISH != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.136.1 deploy --config wrangler.jsonc

      - name: Fail when requested data remains stale
        if: env.ETF_SKIP_PUBLISH != 'true' && env.ETF_SESSION != 'publish'
        run: python -u collector/daily_pipeline.py --session "$ETF_SESSION" --check-only

      - name: Report interrupted update after publishing saved caches
        if: steps.cache_update.outcome == 'failure'
        run: |
          echo "::error::The cache update failed or exceeded 45 minutes. Valid saved caches were published; missing data remains marked stale."
          exit 1
