name: ETF site daily update and deploy

on:
  schedule:
    # GitHub Actions Cron uses UTC. China Standard Time is UTC+8.
    - cron: "40 3 * * 1-5" # 11:40 Asia/Shanghai
    - cron: "10 7 * * 1-5" # 15:10 Asia/Shanghai
    - cron: "45 7 * * 1-5" # 15:45 Asia/Shanghai retry
  workflow_dispatch:
    inputs:
      session:
        description: "Update session"
        required: true
        default: "manual"
        type: choice
        options:
          - manual
          - noon
          - close
          - retry

permissions:
  contents: write

concurrency:
  group: lin-etf-site-daily-update
  cancel-in-progress: false

defaults:
  run:
    working-directory: etf-analysis

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ETF_REQUEST_DELAY: "5"

    steps:
      - name: Verify deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: .
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions Secrets before running the cloud updater."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etf-analysis/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve update session
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            session="${{ inputs.session }}"
          elif [[ "${{ github.event.schedule }}" == "40 3 * * 1-5" ]]; then
            session="noon"
          elif [[ "${{ github.event.schedule }}" == "10 7 * * 1-5" ]]; then
            session="close"
          else
            session="retry"
          fi
          echo "ETF_SESSION=$session" >> "$GITHUB_ENV"
          echo "Selected session: $session"

      - name: Run local tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Update ETF and PETTM caches
        run: python -u collector/daily_pipeline.py --session "$ETF_SESSION"

      - name: Publish dashboard files
        run: python -u collector/publish_to_dashboard.py

      - name: Run browser-data regression test
        run: node tests/dashboard_data_check.js

      - name: Persist validated caches
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A collector/etf_mapping.json collector/candidate_catalog.json collector/output
          if git diff --cached --quiet; then
            echo "No cache changes to commit."
          else
            git commit -m "data: update ETF caches ($ETF_SESSION)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Save raw API responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etf-raw-${{ github.run_id }}-${{ env.ETF_SESSION }}
          path: etf-analysis/collector/output/raw
          if-no-files-found: ignore
          retention-days: 14

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.136.1 deploy --config wrangler.jsonc

      - name: Fail after retry when data remains stale
        if: env.ETF_SESSION == 'retry' || env.ETF_SESSION == 'manual'
        run: python -u collector/daily_pipeline.py --session "$ETF_SESSION" --check-only
