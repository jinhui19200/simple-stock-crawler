# ETF_NETWORK_COMPARISON_DIAGNOSTIC: manual only; never writes price caches.
name: ETF network probe
run-name: ETF network probe ${{ inputs.probe_tag }}
on:
  workflow_dispatch:
    inputs:
      begin:
        required: true
        type: string
      end:
        required: true
        type: string
      probe_tag:
        required: true
        type: string
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only Eastmoney probe
        env:
          PROBE_BEGIN: ${{ inputs.begin }}
          PROBE_END: ${{ inputs.end }}
        run: python etf-analysis/tools/etf_network_probe.py --label github --begin "$PROBE_BEGIN" --end "$PROBE_END" --output probe-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: etf-network-probe-${{ inputs.probe_tag }}
          path: probe-result.json
          retention-days: 3
